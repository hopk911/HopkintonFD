<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Preplan</title>
  <style>
    :root { --bg:#0b1220; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#60a5fa; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; background:#0f172a; padding:12px 16px; border-bottom:1px solid #1f2937; }
    header h1 { margin:0; font-size:18px; }
    main { max-width:1000px; margin:24px auto; padding:0 16px; }
    form { background:var(--card); padding:16px; border-radius:12px; }
    .grid { display:grid; gap:12px; grid-template-columns: repeat(2, minmax(0,1fr)); }
    .field { display:flex; flex-direction:column; }
    label { font-size:12px; color:var(--muted); margin-bottom:4px; }
    input, textarea, select {
      background:#0b1220; color:var(--text); border:1px solid #374151; border-radius:8px; padding:10px; font-size:14px;
    }
    textarea { min-height:90px; resize:vertical; }
    .row { display:flex; gap:12px; margin-top:16px; }
    .row .spacer { flex:1; }
    .btn { appearance:none; border:1px solid #1f2937; background:#111827; color:#e5e7eb; border-radius:10px; padding:10px 14px; cursor:pointer; }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#0b1220; font-weight:600; }
    .notice { margin-top:12px; color:#a7f3d0; display:none; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header><h1 id="title">Edit Record</h1></header>
  <main>
    <form id="editForm">
      <div id="fields" class="grid"></div>
      <div class="row">
        <button type="button" class="btn" id="cancelBtn" onclick="requestCloseWindow()">Close</button>
        <div class="spacer"></div>
        <button type="submit" class="btn primary">Save Changes</button>
      </div>
      <div id="saveMsg" class="notice">Saved!</div>
    </form>
  </main>

  <script>
    // ---- CONFIG ----
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwysXsTCRNZSgj1EkaOqQJYKhQt62KeoQyVriKPszDvv80gpnfeOViYZrKbxrtO17rQVw/exec'; 
    
    const qs = new URLSearchParams(location.search);
    const key = qs.get('key');
    if (!key) {
      document.getElementById('fields').innerHTML = '<div class="field"><em>No key provided.</em></div>';
    } else {
      boot();
    }

    async function boot() {
      // Fetch meta (headers + keyHeader)
      const meta = await getJSON(GAS_URL + '?fn=meta');
      if (!meta || meta.ok === false) {
        showError('Failed to load sheet headers'); return;
      }

      // Fetch row
      const rowRes = await getJSON(GAS_URL + '?fn=row&key=' + encodeURIComponent(key));
      if (!rowRes || rowRes.ok === false) {
        showError(rowRes && rowRes.error ? rowRes.error : 'Failed to load row'); return;
      }

      const headers = rowRes.headers || meta.headers;
      const data = rowRes.row || {};
      document.getElementById('title').textContent = 'Edit Record (' + (meta.keyHeader || '_rowNumber') + ': ' + key + ')';

      // Build inputs for ALL headers
      const fields = document.getElementById('fields');
      fields.innerHTML = '';
      headers.forEach(h => {
        const v = data[h] == null ? '' : data[h];
        const el = document.createElement('div');
        el.className = 'field';
        el.innerHTML = `
          <label>${escapeHtml(h)}</label>
          ${isLongText(h, String(v)) 
              ? `<textarea name="${escapeAttr(h)}">${escapeHtml(String(v))}</textarea>`
              : `<input type="text" name="${escapeAttr(h)}" value="${escapeAttr(String(v))}" />`
          }
        `;
        fields.appendChild(el);
      });

      // Submit handler
      const form = document.getElementById('editForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const values = {};
        for (const [k, val] of formData.entries()) values[k] = val;

        const payload = { fn: 'update', key, values };
        const res = await postJSON(GAS_URL, payload);
        if (res && res.ok) {
          const msg = document.getElementById('saveMsg');
          msg.style.display = 'block';
          setTimeout(() => msg.style.display = 'none', 1500);
        } else {
          alert('Save failed: ' + (res && res.error ? res.error : 'unknown error'));
        }
      });
    }

    function isLongText(header, value) {
      // Heuristics: treat certain fields as textarea
      const h = header.toLowerCase();
      if (h.includes('notes') || h.includes('description') || h.includes('comments')) return true;
      return String(value).length > 120;
    }

    async function getJSON(url) {
      const r = await fetch(url, { method: 'GET' });
      return r.json();
    }
    async function postJSON(url, obj) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify(obj)
      });
      return r.json();
    }

    function showError(msg) {
      document.getElementById('fields').innerHTML = `<div class="field"><em>${escapeHtml(msg)}</em></div>`;
    }
    function escapeHtml(s) {
      return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }
  </script>
</body>
</html>
