  <main class="content">
    <header class="page-header">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <input id="search-input" class="search-input" placeholder="Search address or business..." aria-label="Search address or business" />
        <button class="search-btn" type="submit" aria-label="Search">Search</button>
</form>
      <h1 id="page-title">Pre-Plan</h1>
    </header>

<!-- Title + search stay as-is -->

<!-- General Contact + Map -->
<section class="intro" id="intro" hidden>
  <!-- your General Contact tile + map wrapper live here -->
  <div id="map-wrapper" hidden>
    <div id="map" aria-label="Parcel Map"></div>
  </div>
</section>

    <section class="tiles">
      <article class="tile fire" id="fire" aria-labelledby="fire-title">
        <div class="tile-head"><h3 class="tile-title" id="fire-title">Fire</h3></div>
        <div class="tile-body" id="fire-body"></div>
        <div class="thumbs" id="fire-photos"></div>
      </article>
      <article class="tile ems" id="ems" aria-labelledby="ems-title">
        <div class="tile-head"><h3 class="tile-title" id="ems-title">EMS</h3></div>

        <div class="thumbs" id="ems-photos"></div>
      </article>
      <article class="tile water" id="water" aria-labelledby="water-title">
        <div class="tile-head"><h3 class="tile-title" id="water-title">Water</h3></div>
        <div class="tile-body" id="water-body"></div>
        <div class="thumbs" id="water-photos"></div>
      </article>
      <article class="tile gas" id="gas" aria-labelledby="gas-title">

        <div class="thumbs" id="gas-photos"></div>
      </article>
      <article class="tile electric" id="electric" aria-labelledby="electric-title">
        <div class="tile-head"><h3 class="tile-title" id="electric-title">Electric</h3></div>

        <div class="thumbs" id="electric-photos"></div>

      <article class="tile construction" id="construction" aria-labelledby="construction-title">

        <div class="thumbs" id="construction-photos"></div>

      <article class="tile elevator" id="elevator" aria-labelledby="elevator-title">

  <!-- Simple image popup -->
  <dialog class="img-modal" id="img-modal">
  <div class="modal-inner">

    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <img id="modal-img" alt="Preview" />

  </div>
</dialog>

<!-- Edit Row Modal -->
<dialog id="edit-modal" class="img-modal">
  <div class="modal-inner">
    <header class="modal__header">
      <h3 class="tile-title" id="edit-title">Edit Row</h3>
      <button type="button" id="edit-close" aria-label="Close">✕</button>
    </header>
    <div class="modal__body">
      <form id="edit-form">
        <input type="hidden" name="id" id="edit-id">
        <label>Business Name
          <input name="Business Name" id="edit-business" required>
        </label>
        <label>Site Address
          <input name="Site Address" id="edit-address">
        </label>
        <label>Phone
          <input name="Phone" id="edit-phone">
        </label>
        <label>Notes
          <textarea name="Notes" id="edit-notes" rows="4"></textarea>
        </label>
        <div class="modal__footer" style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" id="edit-cancel">Cancel</button>
          <button type="submit" id="edit-save">Save</button>
        </div>
      </form>
    </div>
  </div>
</dialog>
