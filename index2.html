<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hopkinton Property Lookup</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.css"/>
<script src="https://unpkg.com/esri-leaflet-geocoder@3.1.4/dist/esri-leaflet-geocoder.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{--bg:#0b1220;--panel:#0f172a;--text:#e5e7eb;--muted:#94a3b8;--line:#1f2937;}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1300px;margin:0 auto;padding:10px 14px;display:grid;grid-template-columns:1fr;gap:10px}
.controls{display:flex;gap:8px;align-items:center}
.controls input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#e5e7eb;min-width:260px}
.controls button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#e5e7eb;cursor:pointer}

/* --- Responsive layout --- */
main{
  display:grid;
  grid-template-columns: 1fr 480px;
  gap: 0;
  min-height: calc(100vh - 60px);
}

/* Map scales with width via aspect-ratio */
#map{
  position:relative;
  margin:12px;
  border-radius:12px;
  overflow:hidden;
  aspect-ratio: 16 / 11;
  height: auto;
  min-height: 320px;
}

aside{border-left:1px solid var(--line);padding:14px;overflow:auto}
.hint{color:var(--muted);min-height:1.2em}
.summary .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:#cbd5e1}
table.kv{width:100%;border-collapse:collapse;margin-top:6px}
.kv th,.kv td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.kv th{color:#cbd5e1;font-weight:600;width:40%}
.kv td{color:#e5e7eb}
.photo-strip{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.photo-strip a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.photo-strip img{display:block;width:140px;height:105px;object-fit:cover}
.photo-cell{display:flex;flex-wrap:wrap;gap:6px}
.photo-cell a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.photo-cell img{display:block;width:120px;height:90px;object-fit:cover}
.small{color:#93a0b5;font-size:12px}
#sheetStatus{display:none}

/* --- Stack map & panel when narrow --- */
@media (max-width: 1024px){
  main{ grid-template-columns: 1fr; grid-auto-rows: auto; }
  #map{
    margin:12px 12px 0 12px;
    aspect-ratio: 16 / 12;
    min-height: 300px;
  }
  aside{
    border-left: none;
    border-top: 1px solid var(--line);
    padding: 12px;
  }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="controls">
      <input id="addrInput" placeholder="Search address (e.g., 73 Main Street)"/>
      <button id="addrBtn">Search</button>
      <span id="status" class="hint"></span>
    </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <aside>
    <div id="summary" class="summary"></div>

    <!-- Only the Sheet's Column C (or header exactly 'Photo') goes here -->
    <div id="sheetPhotosTop" class="photo-strip"></div>

    <table id="attrs" class="kv"></table>
    <div id="sheetStatus" class="small"></div>
    <table id="sheetTable" class="kv"></table>
  </aside>
</main>

<script>
// ================== CONFIG ==================
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw03c7Rrm_7oweQJUiprYdF5FXDzRRiYO3WjI97Nezq-D1GOQ69UPzRZNibGai7WL52Rg/exec";
const FS_URL    = "https://services1.arcgis.com/hGdibHYSPO59RG1h/ArcGIS/rest/services/L3_TAXPAR_POLY_ASSESS_gdb/FeatureServer/0";
const HOP       = [42.228, -71.523];
// ============================================

// Map
const map = L.map('map',{zoomControl:true}).setView(HOP,13);
window.map = map;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
// Keep Leaflet crisp on size changes
let resizeRaf=null; window.addEventListener('resize',()=>{ if(resizeRaf) cancelAnimationFrame(resizeRaf); resizeRaf=requestAnimationFrame(()=>map.invalidateSize()); });
setTimeout(()=>map.invalidateSize(),150);

// Parcels
const parcelLayer = L.esri.featureLayer({
  url: FS_URL,
  where: "TOWN_ID=139",
  simplifyFactor: 0.2,
  precision: 6,
  style: { color:'#60a5fa', weight:1, fillOpacity:0.05 }
}).addTo(map);

// UI refs
const statusEl    = document.getElementById('status');
const summaryEl   = document.getElementById('summary');
const attrsTable  = document.getElementById('attrs');
const sheetTable  = document.getElementById('sheetTable');
const sheetPhotosTop = document.getElementById('sheetPhotosTop');
const addrInput   = document.getElementById('addrInput');
const addrBtn     = document.getElementById('addrBtn');
function setStatus(t){ if(statusEl) statusEl.textContent = t || ''; }

// --- helpers ---
function driveThumb(url){
  try{
    const u = new URL(url);
    const id = u.searchParams.get('id') ||
               (u.hostname.includes('drive.google.com') ? (url.match(/\/file\/d\/([^/]+)/)||[])[1] : null);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w480` : null;
  }catch{ return null; }
}
const isPhotoHeader   = h => /(photo|image|img|picture|pic)/i.test(h);
const isTimestamp     = h => /^timestamp$/i.test(h);
const equalsPhotoName = h => /^photo$/i.test(h);
const normHeader = h => String(h || '')
  .toLowerCase()
  .normalize('NFKD')
  .replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]/g, '');
const isSheetAddress = h => {
  const n = normHeader(h);
  return (
    n === 'address'        ||
    n === 'siteaddress'    ||
    n === 'siteaddr'       ||
    n === 'streetaddress'  ||
    n === 'fullstr'        ||
    n === 'location'       ||
    n.startsWith('address')||
    n.startsWith('siteaddress')
  );
};

// Sheet model
const sheet = { url:SHEET_URL, ready:false, headers:[], index:new Map() };
const normalizeKey = v => String(v||'').toUpperCase().replace(/\s+/g,' ').trim();

// Prefer header named "Photo"; else use Column C (index 2)
function getTopPhotoHeader(){
  if (!sheet.headers || sheet.headers.length === 0) return null;
  const named = sheet.headers.find(equalsPhotoName);
  if (named) return named;
  return sheet.headers[2] || null;
}

// ---------- Top strip: ONLY Column C / "Photo" ----------
function renderSheetPhotosTop(row){
  sheetPhotosTop.innerHTML = '';
  const topHeader = getTopPhotoHeader();
  if (!topHeader || !(topHeader in row)) return;

  const cell = String(row[topHeader] ?? '').trim();
  if(!cell) return;

  const links = cell.split(',').map(s=>s.trim()).filter(Boolean);
  links.forEach(link=>{
    const a = document.createElement('a'); a.href = link; a.target = '_blank'; a.rel = 'noopener';
    let src = driveThumb(link);
    if(!src && /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(link)) src = link;
    if(src){
      const img = document.createElement('img'); img.src = src; img.alt = topHeader; img.loading='lazy';
      a.appendChild(img);
    }else{
      a.textContent = link; a.style.padding = '6px 8px';
    }
    sheetPhotosTop.appendChild(a);
  });
}

// ---------- Inline sheet table: all other columns ----------
function renderSheetFields(row){
  sheetTable.innerHTML = '';
  const headers = sheet.headers.length ? sheet.headers : Object.keys(row);
  const topHeader = getTopPhotoHeader();

  headers.forEach(h=>{
    if(!(h in row)) return;
    if (isTimestamp(h)) return;        // hide Timestamp
    if (isSheetAddress(h)) return;     // hide sheet address columns
    if (topHeader && h === topHeader) return; // Column C up top

    const val = String(row[h] ?? '').trim();
    if(!val) return;

    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent = h;
    const td = document.createElement('td');

    if (isPhotoHeader(h) || /^https?:\/\//i.test(val)){
      const links = val.split(',').map(s=>s.trim()).filter(Boolean);
      if (!links.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'photo-cell';
      links.forEach(link=>{
        const a = document.createElement('a'); a.href = link; a.target = '_blank'; a.rel = 'noopener';
        let src = driveThumb(link);
        if (!src && /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(link)) src = link;
        if (src){
          const img = document.createElement('img'); img.src = src; img.alt = h; img.loading='lazy';
          a.appendChild(img);
        } else {
          a.textContent = link; a.style.padding = '6px 8px';
        }
        wrap.appendChild(a);
      });
      if (!wrap.childNodes.length) return;
      td.appendChild(wrap);
    } else {
      td.textContent = val;
    }

    tr.append(th,td);
    sheetTable.appendChild(tr);
  });
}

function showSheetJoin(props){
  if (!sheet.ready){ sheetTable.innerHTML=''; sheetPhotosTop.innerHTML=''; return; }
  const key = normalizeKey(
    props.MAP_PAR_ID ?? props.LOC_ID ?? props.MAP_PAR ?? props.PARCELID ?? props.MAP_LOT ?? props.PID ?? props.MAP_PAR_ID_NO ?? props.LOC_ID_1 ?? props.LOC_ID_2
  );
  if (!key){ sheetTable.innerHTML=''; sheetPhotosTop.innerHTML=''; return; }
  const row = sheet.index.get(key);
  if (row){
    renderSheetPhotosTop(row);
    renderSheetFields(row);
  } else {
    sheetTable.innerHTML=''; sheetPhotosTop.innerHTML='';
  }
}

// Auto-load sheet (JSON first, then CSV)
document.addEventListener('DOMContentLoaded', ()=>{
  if (!sheet.url){ return; }
  fetch(sheet.url,{credentials:'omit'}).then(r=>r.text()).then(txt=>{
    try{
      const json = JSON.parse(txt);
      const rows = Array.isArray(json) ? json :
                   Array.isArray(json.data) ? json.data :
                   Array.isArray(json.rows) ? json.rows : [];
      if (rows.length){
        sheet.headers = Object.keys(rows[0]||{});
        const keyCol = sheet.headers[0];
        rows.forEach(row=>{
          const key = normalizeKey(row[keyCol]);
          if (key) sheet.index.set(key,row);
        });
        sheet.ready = true;
        return;
      }
      throw new Error('no JSON rows');
    }catch{
      Papa.parse(txt,{header:true,skipEmptyLines:true,complete:(res)=>{
        const data = res.data||[];
        if (!data.length){ return; }
        sheet.headers = Object.keys(data[0]||{});
        const keyCol = sheet.headers[0];
        data.forEach(row=>{
          const key = normalizeKey(row[keyCol]);
          if (key) sheet.index.set(key,row);
        });
        sheet.ready = true;
      }});
    }
  });
});

// -------- Parcel attributes --------
function pick(o, keys){
  for(const k of keys){
    if(o && o[k]!=null){
      const v = String(o[k]).trim();
      if(v) return v;
    }
  }
  return null;
}
function renderAttributes(a){
  const rows = [];
  const siteAddr = pick(a,['SITE_ADDR','ADDRESS','FULL_STR','LOCATION']);
  const city     = pick(a,['CITY','MUNIC','TOWN','CITY_NAME']);
  const zip      = pick(a,['ZIP','ZIPCODE','ZIP_CODE','POSTCODE']);
  const zoning   = pick(a,['ZONING','ZONE','ZONING_CODE','ZONE_CODE']);
  const mappar   = pick(a,['MAP_PAR_ID','LOC_ID','MAP_PAR','PARCELID','MAP_LOT','PID','MAP_PAR_ID_NO','LOC_ID_1','LOC_ID_2']);
  const stories  = pick(a,['STORIES','STORY_NO','NO_STORY']);
  const units    = pick(a,['UNITS','NUM_UNITS','UNIT_COUNT']);
  const style    = pick(a,['STYLE','BLDG_STYLE','HOUSE_STYLE']);

  // Title (address) at top
  summaryEl.innerHTML = '';
  if (siteAddr){
    const title = document.createElement('div');
    title.style.fontWeight = '800';
    title.style.fontSize = '22px';
    title.style.lineHeight = '1.1';
    title.textContent = String(siteAddr).toUpperCase();
    summaryEl.appendChild(title);
  }
  if (city || zip){
    const sub = document.createElement('div');
    sub.style.color = '#cbd5e1';
    sub.style.fontSize = '18px';
    sub.style.marginTop = '2px';
    sub.textContent = [city,zip].filter(Boolean).join(' ');
    summaryEl.appendChild(sub);
  }
  if (mappar){
    const pill = document.createElement('div');
    pill.style.marginTop='8px'; pill.style.display='flex'; pill.style.gap='6px'; pill.style.flexWrap='wrap';
    const span = document.createElement('span');
    span.className='pill'; span.textContent = mappar;
    pill.appendChild(span); summaryEl.appendChild(pill);
  }

  if (siteAddr) rows.push(['Site Address', siteAddr]);
  if (city)     rows.push(['City', city]);
  if (zip)      rows.push(['Zip', zip]);
  if (zoning)   rows.push(['Zoning', zoning]);
  if (mappar)   rows.push(['Map/Parcel ID', mappar]);
  if (stories)  rows.push(['Stories', stories]);
  if (units)    rows.push(['Units', units]);
  if (style)    rows.push(['Style', style]);

  attrsTable.innerHTML='';
  for(const [k,v] of rows){
    const tr=document.createElement('tr');
    const th=document.createElement('th'); th.textContent=k;
    const td=document.createElement('td'); td.textContent=String(v);
    tr.append(th,td); attrsTable.appendChild(tr);
  }

  // After attrs table is built, add Google Sheet join (Column C above address)
  showSheetJoin(a);
}

// Highlight and show feature
let highlight=null;
function renderFromFeature(feature){
  if(!feature) return;
  const props = feature.properties || feature.attributes || {};
  try{ if(highlight) map.removeLayer(highlight); }catch{}
  highlight = L.geoJSON(feature,{interactive:false,style:{color:'#93c5fd',weight:3,fillColor:'#60a5fa',fillOpacity:.25}}).addTo(map);
  try{ const b=highlight.getBounds(); if(b && b.isValid()) map.fitBounds(b.pad(.25)); }catch{}
  renderAttributes(props);
}

// Click on parcel → show info + sheet join
parcelLayer.on('click',(e)=>{ if(e.originalEvent) L.DomEvent.stop(e.originalEvent); renderFromFeature(e.layer.feature); });

// -------- Search: field tries then geocode --------
const ST_FIELDS=['ADDRESS','SITE_ADDR','FULL_STR','LOCATION','ST_NAME','STREET','STREETNAME'];
const esc = s => String(s).replace(/'/g,"''");
const norm= s => String(s||'').toUpperCase().replace(/[.,#]/g,' ').replace(/\s+/g,' ').trim();
function esriQuery(where,limit=6){
  return new Promise(res=>L.esri.query({url:FS_URL}).where(where).returnGeometry(true).limit(limit).run((err,fc)=>res(err?null:fc)));
}
async function addressSearch(qraw){
  const RAW=norm(qraw);
  const tries=[
    `TOWN_ID=139 AND UPPER(SITE_ADDR)='${RAW}'`,
    `TOWN_ID=139 AND UPPER(SITE_ADDR) LIKE '${RAW}%'`,
    `TOWN_ID=139 AND UPPER(SITE_ADDR) LIKE '${RAW.replace(/ STREET$/,' ST')}%'`,
    `TOWN_ID=139 AND UPPER(SITE_ADDR) LIKE '${RAW.replace(/ ST$/,' STREET')}%'`,
    `TOWN_ID=139 AND UPPER(FULL_STR)='${RAW}'`,
    `TOWN_ID=139 AND UPPER(FULL_STR) LIKE '${RAW}%'`,
    `TOWN_ID=139 AND UPPER(LOCATION)='${RAW}'`,
    `TOWN_ID=139 AND UPPER(LOCATION) LIKE '${RAW}%'`,
  ];
  const m=RAW.match(/^(\d+)\s+(.+)$/);
  if(m){
    const num=m[1], street=m[2];
    tries.push(`TOWN_ID=139 AND ADDR_NUM=${num} AND UPPER(ADDRESS)='${street}'`);
    tries.push(`TOWN_ID=139 AND ADDR_NUM=${num} AND UPPER(ADDRESS) LIKE '${street}%'`);
    tries.push(`TOWN_ID=139 AND ADDR_NUM=${num} AND UPPER(ADDRESS) LIKE '${street.replace(/ STREET$/,' ST')}%'`);
    tries.push(`TOWN_ID=139 AND UPPER(ADDRESS) LIKE '${street.replace(/ ST$/,' STREET')}%'`);
  }
  const ors=ST_FIELDS.map(f=>`UPPER(${f}) LIKE '%${esc(RAW)}%'`).join(' OR ');
  tries.push(`TOWN_ID=139 AND (${ors})`);

  for(const w of tries){
    const fc=await esriQuery(w,8);
    if(fc && fc.features && fc.features.length){
      renderFromFeature(fc.features[0]); // show result immediately
      return true;
    }
  }
  return false;
}
async function geocodeAndSnap(q){
  return new Promise(resolve=>{
    const text=/hopkinton/i.test(q)?q:`${q}, Hopkinton, MA`;
    L.esri.Geocoding.geocode().text(text).city('Hopkinton').region('MA').maxLocations(1)
      .run(async (e,r)=>{
        if(!e && r && r.results && r.results.length){
          const ll=r.results[0].latlng; map.setView(ll,17);
          const near=await new Promise(res=>L.esri.query({url:FS_URL}).where("TOWN_ID=139").nearby(ll,18).limit(1).run((err,fc)=>res(err?null:fc)));
          if(near && near.features && near.features.length){
            renderFromFeature(near.features[0]);
            resolve(true); return;
          }
        }
        resolve(false);
      });
  });
}
async function searchAndSelect(){
  const q=(addrInput.value||'').trim(); if(!q) return;
  setStatus('Searching…');
  try{
    if(await addressSearch(q)){ setStatus(''); return; }
    if(await geocodeAndSnap(q)){ setStatus(''); return; }
    setStatus('Address not found.');
  }catch(e){ console.error(e); setStatus('Address not found.'); }
}
addrBtn.onclick = searchAndSelect;
addrInput.addEventListener('keydown',e=>{ if(e.key==='Enter') searchAndSelect(); });

parcelLayer.once('load',()=>setStatus(''));
</script>
</body>
</html>
